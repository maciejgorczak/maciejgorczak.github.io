    <style>
        .signal-tip {
            position: absolute;
            top: 0; left: 0;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            background: var(--bg);
            border: 1px solid var(--ink);
            padding: 0.55rem 0.7rem;
            max-width: 240px;
            transition: opacity 0.12s linear;
        }
        .signal-tip-years {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }
        .signal-tip-role {
            font-family: var(--font-display);
            font-size: 0.92rem;
            font-weight: 500;
            line-height: 1.25;
            color: var(--ink);
        }
        .signal-tip-org {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }
    </style>
